<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Senou Pay — Mockup panneaux</title>
<link rel="stylesheet" href="ui.css">
<style>
  html, body { width: 1200px; height: 628px; overflow: hidden; }
  body {
    background: #FCFAFE;
    background-image: radial-gradient(rgba(36,27,46,0.12) 1px, transparent 1px);
    background-size: 18px 18px;
    position: relative;
  }
  .stage { position: absolute; inset: 0; }

  .float { position: absolute; background: #fff; border-radius: 24px;
    box-shadow: 0 34px 70px rgba(36,27,46,0.16); overflow: hidden; font-size: 13px; }

  /* panneau Cartes (gauche) */
  .p-cards { left: 44px; top: 96px; width: 330px; height: 520px; transform: rotate(-6deg); padding: 26px 24px;
    background: linear-gradient(170deg, #ffffff 0%, #F7EFFB 100%); }
  .s-head { display: flex; justify-content: space-between; align-items: center; }
  .menu, .gear { color: var(--secondary); font-size: 17px; }
  .card-wrap { position: relative; margin-top: 22px; }
  .card-wrap .sp-card { width: 172px; }
  .card-ghost { position: absolute; right: -8px; top: 12px; width: 60px; height: 190px; border-radius: 14px;
    background: #fff; box-shadow: 0 12px 30px rgba(36,27,46,0.10); z-index: -1; }
  .dots { display: flex; gap: 5px; margin-top: 16px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--soft); }
  .dots i.on { background: var(--primary); }
  .lbl-block { margin-top: 44px; font-size: 13px; }
  .src { margin-top: 8px; background: #fff; border-radius: 14px; padding: 12px 14px;
    box-shadow: 0 10px 26px rgba(36,27,46,0.08); }
  .av-sm { width: 28px; height: 28px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; }
  .src .menu { margin-left: auto; }
  .cardnum { margin-top: 22px; font-weight: 600; font-size: 15px; display: flex; justify-content: space-between; }
  .eye { color: var(--text2); }

  /* panneau Mon argent (centre) */
  .p-money { left: 400px; top: -6px; width: 330px; height: 600px; transform: rotate(-6deg); padding: 22px 20px; overflow: visible;
    background: linear-gradient(180deg, #ffffff 0%, #FBF6FE 100%); }
  .tiles { display: grid; grid-template-columns: repeat(4, 126px); gap: 10px; margin-top: 14px; width: 554px; }
  .logo-dot { width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: #fff;
    display: grid; place-items: center; font-size: 15px; margin-bottom: 26px; }
  .emoji { font-size: 20px; margin-bottom: 26px; }
  .tile .val { margin-top: 2px; white-space: nowrap; font-size: 15px; }
  .ph.g1 { background: linear-gradient(150deg, #6b4a7d, #C06CE8 55%, #f0c36b); }
  .ph.g2 { background: linear-gradient(150deg, #2E9E5B, #7fbf8a 50%, #C06CE8); }
  .sect { margin-top: 18px; font-size: 13px; font-weight: 600; }
  .cta-bar { margin-top: 12px; }

  /* panneau Profil (droite) */
  .p-profile { right: 30px; top: 214px; width: 322px; height: 360px; transform: rotate(-6deg); padding: 22px 20px; }
  .profile-card { position: relative; margin-top: 18px; border-radius: 16px; padding: 18px; color: #fff;
    background: linear-gradient(140deg, var(--primary), #8E3FBE); box-shadow: 0 16px 34px rgba(155,69,198,0.32); }
  .profile-card .name { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 19px; }
  .profile-card .sub { font-size: 12px; opacity: 0.9; }
  .profile-card .adv { margin-top: 42px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; }
  .ava { position: absolute; top: 16px; right: 16px; width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.9); display: grid; place-items: center; }
  .iban { margin-top: 16px; background: #fff; border-radius: 14px; padding: 14px;
    box-shadow: 0 12px 28px rgba(36,27,46,0.10); display: flex; align-items: center; }
  .iban .num { font-weight: 600; font-size: 13px; margin-top: 3px; }
  .iban .copy { margin-left: auto; color: var(--text2); }
  .rowline { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600;
    padding: 13px 2px; border-bottom: 1px solid var(--border); }
  .arw { color: var(--primary); }
</style>
</head>
<body>
<div class="stage">
  <div class="float p-cards" id="a"></div>
  <div class="float p-money" id="b"></div>
  <div class="float p-profile" id="c"></div>
</div>
<script src="screens.js"></script>
<script>
  document.getElementById('a').innerHTML = screenCards();
  document.getElementById('b').innerHTML = screenMoney();
  document.getElementById('c').innerHTML = screenProfile();
</script>
</body>
</html>
